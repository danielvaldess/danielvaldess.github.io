<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Writeups | Daniel Valdés</title>
</head>

<body>
    <header class="scrolled">
        <a href="index.html" class="logo">
            <img src="images/avatar.png" alt="Daniel Valdés Logo" class="logo-img">
        </a>

        <button class="menu-toggle" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav>
            <a href="./documents/Daniel_Valdes_CV.pdf" download="" class="download-cv">Download CV</a>
            <a href="index.html">About Me</a>
            <a href="writeups.html" class="active">Writeups</a>
        </nav>
    </header>

    <section class="writeups-page">
        <h1 class="page-title">WRITEUPS</h1>
        <p class="page-sub">
            CTF challenge writeups, lab walkthroughs, and security research.
        </p>

        <!-- Category filters -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-cat="all">All</button>
        </div>

        <!-- Cards grid -->
        <div class="writeups-grid" id="writeupsGrid"></div>

        <!-- Individual writeup view (hidden by default) -->
        <div class="writeup-view" id="writeupView" style="display:none;">
            <button class="back-btn" id="backBtn">
                <i class="fa-solid fa-arrow-left"></i> Back to Writeups
            </button>
            <div class="writeup-content" id="writeupContent"></div>
        </div>
    </section>

    <script src="scripts/writeups.js"></script>
    <script>
        const grid = document.getElementById('writeupsGrid');
        const filterBar = document.getElementById('filterBar');
        const writeupView = document.getElementById('writeupView');
        const writeupContent = document.getElementById('writeupContent');
        const backBtn = document.getElementById('backBtn');

        // Category icons
        const catIcons = {
            'Web': 'fa-globe',
            'Forense': 'fa-magnifying-glass',
            'Misc': 'fa-puzzle-piece',
            'Pentesting': 'fa-user-secret',
            'Cripto': 'fa-lock',
            'Binarios': 'fa-microchip',
            'General': 'fa-folder'
        };

        // Category colors (matching theme)
        const catColors = {
            'Web': '#b43f26',
            'Forense': '#e67e22',
            'Misc': '#9b59b6',
            'Pentesting': '#2ecc71',
            'Cripto': '#3498db',
            'Binarios': '#f39c12',
            'General': '#95a5a6'
        };

        // Build filter buttons
        const categories = [...new Set(WRITEUPS.map(w => w.category))];
        categories.sort();
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.dataset.cat = cat;
            btn.textContent = cat;
            filterBar.appendChild(btn);
        });

        // Render cards
        function renderCards(filter) {
            const list = filter === 'all' ? WRITEUPS : WRITEUPS.filter(w => w.category === filter);
            grid.innerHTML = '';
            list.forEach(w => {
                const card = document.createElement('div');
                card.className = 'writeup-card';
                card.dataset.id = w.id;

                const icon = catIcons[w.category] || 'fa-folder';
                const color = catColors[w.category] || '#95a5a6';

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-cat" style="color:${color}">
                            <i class="fa-solid ${icon}"></i> ${w.category}
                        </span>
                        <span class="card-pts">${w.points} pts</span>
                    </div>
                    <h3 class="card-title">${w.title}</h3>
                    <p class="card-desc">${getFirstLine(w.content)}</p>
                    <button class="card-btn" style="border-color:${color}; color:${color}">
                        View Writeup <i class="fa-solid fa-arrow-right"></i>
                    </button>
                `;
                card.querySelector('.card-btn').addEventListener('click', () => showWriteup(w.id));
                grid.appendChild(card);
            });
        }

        function getFirstLine(content) {
            const lines = content.split('\n').filter(l => l.trim() && !l.startsWith('#') && !l.startsWith('**Flag') && !l.startsWith('---'));
            for (const line of lines) {
                const clean = line.replace(/`[^`]*`/g, '').replace(/\[REDACTED\]/g, '').trim();
                if (clean.length > 20) return clean.substring(0, 120) + (clean.length > 120 ? '...' : '');
            }
            return 'Challenge walkthrough and analysis.';
        }

        // Show individual writeup
        function showWriteup(id) {
            const w = WRITEUPS.find(x => x.id === id);
            if (!w) return;

            grid.style.display = 'none';
            filterBar.style.display = 'none';
            writeupView.style.display = 'block';

            const color = catColors[w.category] || '#95a5a6';
            writeupContent.innerHTML = `
                <div class="wup-header">
                    <span class="wup-cat" style="color:${color}">
                        <i class="fa-solid ${catIcons[w.category] || 'fa-folder'}"></i> ${w.category} · ${w.points} pts
                    </span>
                    <h2 class="wup-title">${w.title}</h2>
                </div>
                <div class="wup-body">${renderMarkdown(w.content)}</div>
            `;

            window.scrollTo(0, 0);
        }

        // Simple markdown renderer
        function renderMarkdown(md) {
            let html = md;
            // Code blocks
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
                `<pre><code>${escapeHtml(code.trim())}</code></pre>`
            );
            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
            // Headers
            html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
            html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
            // Bold
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Blockquotes
            html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
            // Horizontal rules
            html = html.replace(/^---$/gm, '<hr>');
            // Tables
            html = html.replace(/^\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)+)/gm, (_, header, body) => {
                const ths = header.split('|').map(h => `<th>${h.trim()}</th>`).join('');
                const rows = body.trim().split('\n').map(row => {
                    const tds = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
                    return `<tr>${tds}</tr>`;
                }).join('');
                return `<table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>`;
            });
            // Lists
            html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
            // Paragraphs
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';
            // Clean empty paragraphs
            html = html.replace(/<p>\s*<\/p>/g, '');
            html = html.replace(/<p>\s*(<h[34]>)/g, '$1');
            html = html.replace(/(<\/h[34]>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<pre>)/g, '$1');
            html = html.replace(/(<\/pre>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<table>)/g, '$1');
            html = html.replace(/(<\/table>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<ul>)/g, '$1');
            html = html.replace(/(<\/ul>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<blockquote>)/g, '$1');
            html = html.replace(/(<\/blockquote>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*<hr>/g, '<hr>');
            html = html.replace(/<hr>\s*<\/p>/g, '<hr>');
            return html;
        }

        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // Go back to grid
        backBtn.addEventListener('click', () => {
            writeupView.style.display = 'none';
            grid.style.display = '';
            filterBar.style.display = '';
            window.scrollTo(0, 0);
        });

        // Filter buttons
        filterBar.addEventListener('click', e => {
            if (!e.target.classList.contains('filter-btn')) return;
            filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            renderCards(e.target.dataset.cat);
        });

        // Hash routing
        function handleHash() {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                showWriteup(hash);
            } else {
                writeupView.style.display = 'none';
                grid.style.display = '';
                filterBar.style.display = '';
            }
        }
        window.addEventListener('hashchange', handleHash);

        // Init
        renderCards('all');
        handleHash();

        // Scroll header
        window.addEventListener('scroll', function () {
            const header = document.querySelector('header');
            header.classList.toggle('scrolled', window.scrollY > 50);
        });

        // Mobile menu
        document.addEventListener('DOMContentLoaded', function () {
            const menuToggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('nav');
            menuToggle.addEventListener('click', () => {
                const isActive = nav.classList.contains('active');
                if (isActive) {
                    nav.classList.remove('active');
                    menuToggle.classList.remove('active');
                    document.body.style.overflow = '';
                } else {
                    nav.classList.add('active');
                    menuToggle.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            });
            document.querySelectorAll('nav a').forEach(link => {
                link.addEventListener('click', () => {
                    nav.classList.remove('active');
                    menuToggle.classList.remove('active');
                    document.body.style.overflow = '';
                });
            });
        });
    </script>
    <script src="scripts/songs.js"></script>
</body>
</html>

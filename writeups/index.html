<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <title>Writeups | Daniel Valdés</title>
</head>

<body>
    <header class="scrolled">
        <a href="../" class="logo">
            <span class="logo-terminal"><i class="fa-solid fa-terminal"></i> daninho@terminal</span>
        </a>

        <button class="menu-toggle" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav>
            <a href="../documents/DV_CV.txt" download="DV_CV.txt" class="download-cv">Download CV</a>
            <a href="../">About Me</a>
            <a href="." class="active">Writeups</a>
        </nav>
    </header>

    <section class="writeups-page">
        <h1 class="page-title">WRITEUPS</h1>
        <p class="page-sub">
            CTF challenge writeups, lab walkthroughs, and security research.
        </p>

        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-cat="all">All</button>
        </div>

        <div class="writeups-grid" id="writeupsGrid"></div>

        <div class="writeup-view" id="writeupView" style="display:none;">
            <button class="back-btn" id="backBtn">
                <i class="fa-solid fa-arrow-left"></i> Back to Writeups
            </button>
            <div class="writeup-content" id="writeupContent"></div>
        </div>
    </section>

    <script src="../scripts/writeups.js"></script>
    <script>
        const grid = document.getElementById('writeupsGrid');
        const filterBar = document.getElementById('filterBar');
        const writeupView = document.getElementById('writeupView');
        const writeupContent = document.getElementById('writeupContent');
        const backBtn = document.getElementById('backBtn');

        const catIcons = {
            'Web': 'fa-globe', 'Forensics': 'fa-magnifying-glass', 'Misc': 'fa-puzzle-piece',
            'Pentesting': 'fa-user-secret', 'Crypto': 'fa-lock', 'Binary': 'fa-microchip', 'General': 'fa-folder'
        };
        const catColors = {
            'Web': '#e74c3c', 'Forensics': '#e67e22', 'Misc': '#9b59b6',
            'Pentesting': '#2ecc71', 'Crypto': '#3498db', 'Binary': '#f39c12', 'General': '#95a5a6'
        };

        const fileLabels = {
            'startlab.sh': 'Lab launcher', 'blackout-web01.tar': 'Web lab #1',
            'blackout-web02.tar': 'Web lab #2', 'blackout-web03.tar': 'Web lab #3',
            'blackout-web04.tar': 'Web lab #4', 'blackout-web05.tar': 'Web lab #5',
            'blackout-web06.tar': 'Web lab #6', 'blackout-pt01.tar': 'Pentest lab #1',
            'blackout-pt02.tar': 'Pentest lab #2', 'blackout-pt03.tar': 'Pentest lab #3',
            'blackout-pt04.tar': 'Pentest lab #4', 'turno.log': 'Shift log',
            'alerta.wav': 'Audio alert', 'spectrogram.png': 'Spectrogram',
            'ingeniero.kdbx': 'KeePass vault', 'politica_acceso.txt': 'Access policy',
            'subestacion.jpg': 'Substation photo', 'qr_a.png': 'QR piece A',
            'qr_b.png': 'QR piece B', 'qr_c.png': 'QR piece C',
            'comunicado.html': 'Briefing', 'cargas.csv': 'Load data CSV',
            'sala_control.pcap': 'Network capture', 'exfil_dns.pcap': 'DNS capture',
            'boveda.zip': 'Encrypted vault', 'hash_maestra.sha256': 'Master hash',
            'pista_ingeniero.txt': 'Engineer hint', 'pin_operador.hash': 'PIN hash',
            'leeme.txt': 'Readme', 'nota_recuperacion.zip': 'Recovery note',
            'scada_relay': 'SCADA relay binary', 'shadow_turno.txt': 'Shadow dump',
            'export_consola.txt': 'Console export', 'consola.zip': 'Console archive',
            'telemetry_decode': 'Telemetry decoder', 'blackout_control.pcap': 'Control capture',
            'turno_guard': 'Shift guard binary', 'plc_ladder': 'PLC ladder binary',
        };

        const categories = [...new Set(WRITEUPS.map(w => w.category))].sort();
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.dataset.cat = cat;
            btn.textContent = cat;
            filterBar.appendChild(btn);
        });

        function renderCards(filter) {
            const list = (filter === 'all' ? [...WRITEUPS] : WRITEUPS.filter(w => w.category === filter))
                .sort((a, b) => a.points - b.points);
            grid.innerHTML = '';
            list.forEach(w => {
                const card = document.createElement('div');
                card.className = 'writeup-card';
                const color = catColors[w.category] || '#95a5a6';
                const icon = catIcons[w.category] || 'fa-folder';
                const filesHtml = w.files.length ? `<div class="card-files">${w.files.map(f => `<span class="file-tag"><i class="fa-solid fa-file"></i> ${fileLabels[f] || f}</span>`).join('')}</div>` : '';

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-cat" style="color:${color}"><i class="fa-solid ${icon}"></i> ${w.category}</span>
                        <span class="card-pts">${w.points} pts</span>
                    </div>
                    <h3 class="card-title">${w.title}</h3>
                    <p class="card-desc">${w.desc || 'Challenge walkthrough and analysis.'}</p>
                    <div class="card-bottom">
                        ${filesHtml}
                        <button class="card-btn" style="border-color:${color}; color:${color}">
                            View Writeup <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                `;
                card.querySelector('.card-btn').addEventListener('click', () => showWriteup(w.id));
                grid.appendChild(card);
            });
        }

        let currentColor = '#00d4ff';

        async function showWriteup(id) {
            const w = WRITEUPS.find(x => x.id === id);
            if (!w) return;
            currentColor = catColors[w.category] || '#00d4ff';

            grid.style.display = 'none';
            filterBar.style.display = 'none';
            writeupView.style.display = 'block';

            const filesHtml = w.files.length ? `
                <div class="wup-files">
                    <h4><i class="fa-solid fa-paperclip"></i> Challenge Files</h4>
                    <div class="wup-files-list">
                        ${w.files.map(f => `<span class="wup-file-tag"><i class="fa-solid fa-file"></i> ${fileLabels[f] || f} <span class="file-original">(${f})</span></span>`).join('')}
                    </div>
                </div>
            ` : '';

            writeupContent.innerHTML = `
                <div class="wup-header" style="border-bottom-color: ${currentColor}">
                    <span class="wup-cat" style="color:${currentColor}">
                        <i class="fa-solid ${catIcons[w.category] || 'fa-folder'}"></i> ${w.category} · ${w.points} pts
                    </span>
                    <h2 class="wup-title">${w.title}</h2>
                    ${filesHtml}
                </div>
                <div class="wup-body" style="text-align:center; color:#555;">Loading writeup...</div>
            `;
            window.scrollTo(0, 0);

            try {
                const resp = await fetch(`${w.slug}.md`);
                if (!resp.ok) throw new Error('Not found');
                const md = await resp.text();
                writeupContent.querySelector('.wup-body').innerHTML = renderMarkdown(md);
                writeupContent.querySelector('.wup-body').style.textAlign = '';
            } catch (e) {
                writeupContent.querySelector('.wup-body').innerHTML = '<p style="color:#888;">Writeup not available.</p>';
            }
        }

        function renderMarkdown(md) {
            let html = md;
            html = html.replace(/\r\n/g, '\n');
            // Protect code blocks and inline code from markdown processing
            const codeBlocks = [];
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
                const i = codeBlocks.length;
                codeBlocks.push(`<div class="terminal-block"><div class="terminal-bar"><span class="terminal-dot" style="background:${currentColor}"></span><span class="terminal-dot" style="background:${currentColor}"></span><span class="terminal-dot" style="background:${currentColor}"></span><span class="terminal-title">${lang || 'terminal'}</span></div><pre><code>${escapeHtml(code.trim())}</code></pre></div>`);
                return `\x00CB${i}\x00`;
            });
            const inlineCodes = [];
            html = html.replace(/`([^`]+)`/g, (_, code) => {
                const i = inlineCodes.length;
                inlineCodes.push(`<code class="inline" style="color:${currentColor}">${code}</code>`);
                return `\x00IC${i}\x00`;
            });
            // Escape underscores so they don't become italic
            html = html.replace(/_/g, '\\_');
            // Now process markdown
            html = html.replace(/^### (.+)$/gm, `<h4 style="color:${currentColor}">$1</h4>`);
            html = html.replace(/^## (.+)$/gm, `<h3 style="color:${currentColor}">$1</h3>`);
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            // Merge consecutive blockquote lines into one <blockquote>
            html = html.replace(/((?:^> .+\n?)+)/gm, (block) => {
                const inner = block.replace(/^> ?/gm, '').trim();
                return `<blockquote style="border-left-color:${currentColor}">${inner}</blockquote>`;
            });
            html = html.replace(/^---$/gm, '<hr>');
            html = html.replace(/^\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)+)/gm, (_, header, body) => {
                const ths = header.split('|').map(h => `<th style="border-bottom-color:${currentColor}">${h.trim()}</th>`).join('');
                const rows = body.trim().split('\n').map(row => {
                    const tds = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
                    return `<tr>${tds}</tr>`;
                }).join('');
                return `<table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>`;
            });
            html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
            html = html.replace(/\n\n+/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');
            html = '<p>' + html + '</p>';
            html = html.replace(/<p>\s*<\/p>/g, '');
            html = html.replace(/<p>\s*(<h[34]>)/g, '$1');
            html = html.replace(/(<\/h[34]>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<div class="terminal)/g, '$1');
            html = html.replace(/(<\/div>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<table>)/g, '$1');
            html = html.replace(/(<\/table>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<ul>)/g, '$1');
            html = html.replace(/(<\/ul>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<blockquote>)/g, '$1');
            html = html.replace(/(<\/blockquote>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*<hr>/g, '<hr>');
            html = html.replace(/<hr>\s*<\/p>/g, '<hr>');
            html = html.replace(/<br>\s*(<h[34]>)/g, '$1');
            html = html.replace(/<br>\s*(<div class="terminal)/g, '$1');
            html = html.replace(/<br>\s*(<table>)/g, '$1');
            html = html.replace(/<br>\s*(<ul>)/g, '$1');
            html = html.replace(/<br>\s*(<blockquote>)/g, '$1');
            html = html.replace(/(<\/blockquote>)\s*<br>/g, '$1');
            html = html.replace(/<br>\s*<hr>/g, '<hr>');
            // Restore code blocks and inline code
            html = html.replace(/\x00CB(\d+)\x00/g, (_, i) => codeBlocks[i]);
            html = html.replace(/\x00IC(\d+)\x00/g, (_, i) => inlineCodes[i]);
            return html;
        }

        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        backBtn.addEventListener('click', () => {
            writeupView.style.display = 'none';
            grid.style.display = '';
            filterBar.style.display = '';
            window.scrollTo(0, 0);
        });

        filterBar.addEventListener('click', e => {
            if (!e.target.classList.contains('filter-btn')) return;
            filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            renderCards(e.target.dataset.cat);
        });

        function handleHash() {
            const hash = window.location.hash.replace('#', '');
            if (hash) { showWriteup(hash); }
            else { writeupView.style.display = 'none'; grid.style.display = ''; filterBar.style.display = ''; }
        }
        window.addEventListener('hashchange', handleHash);

        renderCards('all');
        handleHash();

        window.addEventListener('scroll', function () {
            document.querySelector('header').classList.toggle('scrolled', window.scrollY > 50);
        });

        document.addEventListener('DOMContentLoaded', function () {
            const menuToggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('nav');
            menuToggle.addEventListener('click', () => {
                const isActive = nav.classList.contains('active');
                if (isActive) { nav.classList.remove('active'); menuToggle.classList.remove('active'); document.body.style.overflow = ''; }
                else { nav.classList.add('active'); menuToggle.classList.add('active'); document.body.style.overflow = 'hidden'; }
            });
            document.querySelectorAll('nav a').forEach(link => {
                link.addEventListener('click', () => { nav.classList.remove('active'); menuToggle.classList.remove('active'); document.body.style.overflow = ''; });
            });
        });
    </script>
    <script src="../scripts/songs.js"></script>
</body>
</html>
